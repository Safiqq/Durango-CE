[package]
name = "durango-server"
version = "0.1.0"
edition = "2021"
description = "Cleanroom Rust Durango v3.3.6 HTTP Gateway + TCP Game Server with SQLite persistence"

[dependencies]
axum = "0.7"
durango-wire = { path = "../durango-wire" }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
