[package]
name = "durango-gateway"
version = "0.1.0"
edition = "2021"
description = "Cleanroom Rust HTTP Gateway speaking the Durango v3.3.6 protocol"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
